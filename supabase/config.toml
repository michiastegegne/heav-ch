project_id = "heav-studio"

[auth]
enabled = true
site_url = "https://heav.ch/login/"
additional_redirect_urls = ["https://heav.ch/login/", "https://www.heav.ch/login/"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
# Keep the email provider active for existing-user magic links; global Auth signup stays disabled above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.invoice-document]
verify_jwt = false
static_files = ["./functions/_shared/fonts/*.ttf", "./functions/_shared/assets/*.png"]

[functions.contact-enquiry]
verify_jwt = false

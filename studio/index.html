    <div class="loading-screen" id="loading-screen" aria-live="polite"><strong>HEAV</strong><span>Studio wird geladen …</span></div>

        <nav class="main-nav" aria-label="Studio Navigation">
          <button class="nav-link is-active" data-view="dashboard"><span>01</span>Übersicht</button>
          <button class="nav-link" data-view="customers"><span>02</span>Kunden</button>
          <button class="nav-link" data-view="projects"><span>03</span>Projekte</button>
          <button class="nav-link" data-view="invoices"><span>04</span>Rechnungen</button>
          <button class="nav-link" data-view="offers"><span>05</span>Offerten</button>
          <button class="nav-link" data-view="settings"><span>06</span>Einstellungen</button>
          <button class="nav-link" data-view="portal-requests"><span>07</span>Portal-Anfragen</button>

      </aside>
      <div class="nav-scrim" data-close-nav></div>

    </div>
    <dialog class="editor-dialog" id="editor-dialog" aria-labelledby="dialog-title"><form method="dialog" class="dialog-shell" id="editor-form"><header><div><span class="kicker" id="dialog-kicker">NEU</span><h2 id="dialog-title">Eintrag</h2></div><button class="icon-button" value="cancel" type="submit" formnovalidate aria-label="Dialog schliessen">×</button></header><div class="dialog-body" id="dialog-body"></div><footer><p class="form-error" id="form-error" role="alert"></p><button class="secondary-button" value="cancel" type="submit" formnovalidate>Abbrechen</button><button class="primary-action" value="save" type="submit">Speichern</button></footer></form></dialog>

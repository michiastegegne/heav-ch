name: Refresh Instagram statistics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live source
        uses: actions/checkout@v4
      - name: Refresh public profile statistics
        run: node scripts/refresh-instagram-stats.mjs
      - name: Commit changed statistics
        run: |
          if git diff --quiet -- assets/instagram-stats.json; then
            echo "No Instagram statistic changes to publish."
            exit 0
          fi
          git config user.name "HEAV Instagram Stats"
          git config user.email "actions@github.com"
          git add assets/instagram-stats.json
          git commit -m "Refresh Instagram statistics"
          git push

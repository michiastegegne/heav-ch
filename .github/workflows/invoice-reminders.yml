name: Invoice reminders

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase reminder function
        env:
          CRON_SECRET: ${{ secrets.INVOICE_REMINDER_CRON_SECRET }}
        run: |
          curl --fail-with-body --retry 2 --retry-delay 5 \
            -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "content-type: application/json" \
            --data '{}' \
            "https://bkazlpqjvbuhwmjcwexn.supabase.co/functions/v1/invoice-reminders"
